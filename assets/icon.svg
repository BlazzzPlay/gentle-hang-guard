<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="gentle-hang-guard">
  <title>gentle-hang-guard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1530"/>
      <stop offset="1" stop-color="#0d0b17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the guard: a shield -->
  <path d="M64 18 L100 30 V60 C100 84 84 101 64 110 C44 101 28 84 28 60 V30 Z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
  <!-- the hang: an hourglass inside -->
  <path d="M50 42 H78 M50 88 H78" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
  <path d="M54 42 C54 56 74 58 74 65 C74 72 54 74 54 88 M74 42 C74 56 54 58 54 65 C54 72 74 74 74 88" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 84 C60 77 68 77 70 84 Z" fill="#22d3ee"/>
  <!-- the stop mark -->
  <circle cx="96" cy="96" r="15" fill="#0d0b17" stroke="#22d3ee" stroke-width="4"/>
  <rect x="90" y="90" width="12" height="12" rx="2" fill="#22d3ee"/>
</svg>
